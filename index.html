<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>GS MİLA</title><style id="st">
:root{--paper:#fbfbff;--line:#d3dbf5;--txt:#1c2033;--mut:#5d6585;--ac:#2a3fa0;--acf:#fff;--mg:#d9534f;--ok:#1f7a4a;--bad:#c0392b;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#11152b;--line:#222a52;--txt:#e9ecfb;--mut:#9aa3cc;--ac:#9db0ff;--acf:#10142a;--mg:#ff8a80;--ok:#6fd89a;--bad:#ff8a80;--card:#181d3a;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#11152b;--line:#222a52;--txt:#e9ecfb;--mut:#9aa3cc;--ac:#9db0ff;--acf:#10142a;--mg:#ff8a80;--ok:#6fd89a;--bad:#ff8a80;--card:#181d3a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper) repeating-linear-gradient(to bottom,transparent 0 31px,var(--line) 31px 32px);color:var(--txt);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px 26px;border-left:2px solid var(--mg);min-height:100vh;background:linear-gradient(to right,var(--paper) 0,transparent 24px)}
h1{font:700 1.5rem/1.2 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;margin:0 0 4px;color:var(--ac)}
h3{font:700 1.1rem "Iowan Old Style",Palatino,Georgia,serif;margin:22px 0 8px;color:var(--ac)}
.sub{margin:0 0 14px;color:var(--mut);font-size:.9rem}
nav{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
nav button{white-space:nowrap}
button{font:inherit;border:1.5px solid var(--ac);background:var(--card);color:var(--ac);border-radius:4px;padding:9px 14px;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--mg);outline-offset:2px}
button.p,nav button.on{background:var(--ac);color:var(--acf)}
button:disabled{cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.fc{background:var(--card);border:1.5px solid var(--ac);border-radius:4px;padding:26px 18px;text-align:center;margin:12px 0;cursor:pointer}
.fc.st{cursor:default}
.big{font:700 1.7rem/1.3 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;overflow-wrap:anywhere}
.fc small,.mut{color:var(--mut)}
.opt{display:block;width:100%;text-align:left;margin:7px 0;color:var(--txt);border-color:var(--line);border-width:1.5px}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--card))}
.fb{padding:8px 12px;border-left:4px solid var(--ac);background:var(--card);margin:10px 0}
input,select,textarea{font:inherit;width:100%;padding:10px;margin:6px 0;border:1.5px solid var(--line);border-radius:4px;background:var(--card);color:var(--txt)}
label{display:block;margin-top:10px;font-weight:600;font-size:.92rem}
.tp{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);padding:10px 12px;margin:8px 0;border-radius:4px}
canvas.ink{background:#fff;border:1.5px dashed var(--ac);border-radius:6px;touch-action:none;display:block}
canvas.ink.in{display:inline-block;width:240px;height:58px;vertical-align:middle;margin:2px 6px}
.wsr{margin:12px 0;font-size:1.08rem;line-height:1.9}.wsr.col{display:block}.cw{position:relative}.cw canvas.ink{width:100%}
.clr{padding:2px 8px;font-size:.8rem;margin-right:6px}.cw .clr{position:absolute;right:6px;top:6px}
.dot{width:34px;height:34px;border-radius:50%;padding:0;border:2px solid #fff}
.ans{margin:2px 0 8px 10px;font-size:.92rem;color:var(--ok)}.mk{padding:3px 10px;font-size:.8rem;margin-left:6px}.mk.on{background:var(--ok);color:#fff;border-color:var(--ok)}.mk.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.wtool{position:sticky;top:0;background:var(--paper);padding:8px 0;z-index:5;align-items:center}
body.wide main{max-width:920px}
</style></head><body><main>
<h1>GS MİLA</h1>
<p class="sub">Fransızca A2: kelime, dilbilgisi, okuma, dinleme.</p>
<nav></nav><div id="v"></div>
</main><script id="app">
const DATA=/*D*/{"topics":[{"name":"Les livres, la lecture, les habitudes (Kitaplar, okuma, alışkanlıklar)","vocab":[{"fr":"la lecture","tr":"okuma"},{"fr":"un livre / un bouquin","tr":"kitap"},{"fr":"un journal","tr":"gazete"},{"fr":"un magazine","tr":"dergi"},{"fr":"une revue","tr":"dergi (süreli yayın)"},{"fr":"un roman","tr":"roman"},{"fr":"un ouvrage classique","tr":"klasik eser"},{"fr":"une bande dessinée (BD)","tr":"çizgi roman"},{"fr":"une poésie","tr":"şiir"},{"fr":"l'imagination","tr":"hayal gücü"},{"fr":"un conte","tr":"masal, hikaye"},{"fr":"un conte féerique","tr":"peri masalı"},{"fr":"une nouvelle","tr":"öykü, kısa hikaye"},{"fr":"une histoire","tr":"hikaye, tarih"},{"fr":"un livre en langue maternelle","tr":"ana dilde kitap"},{"fr":"un livre en langue étrangère","tr":"yabancı dilde kitap"},{"fr":"une activité relaxante","tr":"rahatlatıcı etkinlik"},{"fr":"une activité reposante","tr":"dinlendirici etkinlik"},{"fr":"une activité ennuyeuse","tr":"sıkıcı etkinlik"},{"fr":"un roman d'aventure","tr":"macera romanı"},{"fr":"un roman d'amour","tr":"aşk romanı"},{"fr":"un roman historique","tr":"tarihi roman"},{"fr":"un roman de science fiction","tr":"bilim kurgu romanı"},{"fr":"un roman fantastique","tr":"fantastik roman"},{"fr":"lire","tr":"okumak"},{"fr":"lire en ligne","tr":"internetten okumak"},{"fr":"plaire à quelqu'un","tr":"birinin hoşuna gitmek"},{"fr":"surfer sur Internet","tr":"internette gezinmek"},{"fr":"acheter des livres","tr":"kitap satın almak"},{"fr":"se détendre","tr":"rahatlamak"},{"fr":"s'amuser","tr":"eğlenmek"},{"fr":"dormir","tr":"uyumak"},{"fr":"utiliser un dictionnaire","tr":"sözlük kullanmak"},{"fr":"développer son imagination","tr":"hayal gücünü geliştirmek"},{"fr":"passer son temps à faire quelque chose","tr":"zamanını bir şey yaparak geçirmek"},{"fr":"apprendre","tr":"öğrenmek"},{"fr":"pour + infinitif","tr":"-mek için"},{"fr":"quand","tr":"-dığında, ne zaman"},{"fr":"lorsque","tr":"-dığı zaman"},{"fr":"de plus / en outre","tr":"ayrıca, üstelik"},{"fr":"mais","tr":"ama"},{"fr":"donc","tr":"bu yüzden, dolayısıyla"},{"fr":"alors","tr":"o halde, böylece"},{"fr":"c'est pourquoi","tr":"bu nedenle"},{"fr":"ou","tr":"veya"},{"fr":"chaque soir / matin / nuit / jour","tr":"her akşam / sabah / gece / gün"},{"fr":"tous les soirs","tr":"her akşam"},{"fr":"toutes les nuits","tr":"her gece"},{"fr":"toujours","tr":"her zaman"},{"fr":"parfois","tr":"bazen"},{"fr":"quelquefois","tr":"bazen"},{"fr":"rarement","tr":"nadiren"},{"fr":"de temps en temps","tr":"ara sıra"},{"fr":"souvent","tr":"sık sık"},{"fr":"jamais","tr":"asla"},{"fr":"une heure par jour","tr":"günde bir saat"},{"fr":"un quart d'heure","tr":"çeyrek saat, 15 dakika"},{"fr":"une demi-heure","tr":"yarım saat"},{"fr":"quelques heures","tr":"birkaç saat"}],"gaps":[{"q":"Aimez-___ lire ?","a":"vous"},{"q":"La lecture me ___.","a":"plaît"},{"q":"La lecture ne me ___ pas.","a":"plaît"},{"q":"Je lis ___ les soirs.","a":"tous"},{"q":"Je lis ___ les nuits.","a":"toutes"},{"q":"Je lis un roman ___ me détendre.","a":"pour"},{"q":"Je lis une heure par ___.","a":"jour"},{"q":"Je ne lis ___ de bande dessinée.","a":"jamais"}]}]}/*E*/;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}},sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const sh=a=>[...a].sort(()=>Math.random()-.5);
let SID=0,SU=null,SPD=ld('spd',1);
const tspd=()=>{SPD=SPD==1?.7:1;sv('spd',SPD);go()};
const say=t=>{try{const S=speechSynthesis,id=++SID,q=t.split(/(?<=[.!?])\s+/);S.cancel();
const nx=()=>{if(id!=SID||!q.length)return;const u=SU=new SpeechSynthesisUtterance(q.shift());u.lang='fr-FR';u.rate=SPD;const v=(S.getVoices()||[]).find(v=>/^fr/i.test(v.lang));if(v)u.voice=v;u.onend=u.onerror=nx;S.speak(u)};setTimeout(nx,100)}catch(e){}};
const stopSay=()=>{SID++;try{speechSynthesis.cancel()}catch(e){}};
const nz=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').trim();
const lev=(a,b)=>{const m=[...Array(a.length+1)].map((_,i)=>[i,...Array(b.length).fill(0)]);for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]};

const BASE=`la gare=tren istasyonu
le billet=bilet
le marché=pazar
acheter=satın almak
la boulangerie=fırın
le fromage=peynir
la semaine=hafta
hier=dün
demain=yarın
souvent=sık sık
toujours=her zaman
parfois=bazen
la maison=ev
l'appartement=daire
la cuisine=mutfak
le voyage=yolculuk
la valise=bavul
l'hôtel=otel
la réservation=rezervasyon
le travail=iş
le rendez-vous=randevu
fatigué=yorgun
content=memnun
la pluie=yağmur
prendre=almak, binmek
aller=gitmek
vouloir=istemek
pouvoir=-ebilmek
devoir=zorunda olmak
la chambre=oda`.split('\n').map(l=>{const[a,b]=l.split('=');return{fr:a,tr:b,t:'A2 Temel'}});
const GR=[
{q:"Hier, je ___ au cinéma.",o:["suis allé","vais","irai"],a:0,e:"Passé composé: aller, être ile çekimlenir."},
{q:"Elle ___ une pomme hier.",o:["a mangé","est mangé","mange"],a:0,e:"Manger, avoir ile çekimlenir."},
{q:"Demain, nous ___ visiter Paris.",o:["allons","allez","vont"],a:0,e:"Futur proche: aller + mastar."},
{q:"Je ___ parler français un peu.",o:["peux","peut","pouvons"],a:0,e:"Pouvoir: je peux."},
{q:"C'est ___ amie Sophie.",o:["ma","mon","mes"],a:0,e:"Amie dişil olduğu için ma."},
{q:"Il y a ___ eau dans le verre.",o:["de l'","du","des"],a:0,e:"Eau ünlüyle başlar: de l'."},
{q:"Je ne mange ___ de viande.",o:["pas","très","aussi"],a:0,e:"Olumsuzluk: ne ... pas."},
{q:"Vous ___ un billet ?",o:["voulez","veux","veut"],a:0,e:"Vouloir: vous voulez."}];
const RD=[
{t:"Marie habite à Lyon avec son mari et sa fille. Le samedi, elle va au marché pour acheter des légumes et du fromage. Ensuite, elle prend un café avec une amie. Dimanche prochain, ils vont visiter Paris en train.",
q:[{q:"Où habite Marie ?",o:["À Lyon","À Paris","À Nice"],a:0},{q:"Qu'est-ce qu'elle achète au marché ?",o:["Des légumes et du fromage","Du pain","Des fruits"],a:0},{q:"Comment vont-ils à Paris ?",o:["En train","En voiture","En avion"],a:0}]},
{t:"Tom a réservé une chambre à l'hôtel pour deux nuits. Hier, il est arrivé à la gare à dix-huit heures. Il fait froid et il pleut, alors il prend un taxi.",
q:[{q:"Combien de nuits a-t-il réservé ?",o:["Deux","Trois","Une"],a:0},{q:"Pourquoi prend-il un taxi ?",o:["Il pleut","Il est content","Il est midi"],a:0}]}];
const SENT=["Je voudrais un billet pour Lyon, s'il vous plaît.","Hier, nous sommes allés au marché.","Où est la gare, s'il vous plaît ?","Il fait chaud aujourd'hui.","Elle a réservé une chambre pour deux nuits.","Demain, je vais visiter Paris avec mon amie."];

let tab='cards',topic='Hepsi',topics=DATA.topics,known=ld('known',{}),ADMIN=false,draft=null,busy='';
let ci=0,fl=false,Q=null,qi=0,sc=0,ans=null,okf=false,rp=0,rs={},LS=null,P={s:SENT[0]};
const allV=()=>BASE.concat(topics.flatMap(t=>t.vocab.map(v=>({...v,t:t.name}))));
const pool=()=>allV().filter(v=>topic=='Hepsi'||v.t==topic);
const cur=()=>{const L=pool();return L[ci%L.length]};
function sel(){const n=['Hepsi','A2 Temel',...topics.map(t=>t.name)];return `<select aria-label="Konu" onchange="topic=this.value;ci=0;fl=false;Q=null;go()">${n.map(x=>`<option ${x==topic?'selected':''}>${esc(x)}</option>`).join('')}</select>`}

function vCards(){const L=pool();if(!L.length)return sel()+'<p class="mut">Bu konuda kelime yok.</p>';const c=cur();
return sel()+`<div class="fc" onclick="fl=!fl;go()"><div class="big">${esc(fl?c.tr:c.fr)}</div><small>${fl?'Türkçe':'Dokun: anlamı gör'}</small></div>
<div class="row"><button onclick="say(cur().fr)">Dinle</button><button onclick="mk(0)">Tekrar</button><button class="p" onclick="mk(1)">Biliyorum</button></div>
<p class="mut">${ci%L.length+1}/${L.length}. Bildiklerin: ${L.filter(x=>known[x.fr]).length}</p>`}
const mk=v=>{known[cur().fr]=v;sv('known',known);ci++;fl=false;go()};

function build(kind){const items=[],V=pool();
if(kind!='g')sh(V).slice(0,10).forEach(c=>{const d=Math.random()<.5,f=d?'fr':'tr',t=d?'tr':'fr',o=sh(V.filter(x=>x!==c)).slice(0,3);items.push({y:'m',p:c[f],say:d?c.fr:null,o:sh([c,...o]).map(x=>x[t]),a:c[t],lab:d?'Anlamı nedir?':'Fransızcası hangisi?'})});
if(kind!='k'){if(topic=='Hepsi'||topic=='A2 Temel')GR.forEach(g=>items.push({y:'m',p:g.q,o:sh(g.o),a:g.o[g.a],e:g.e,lab:'Boşluğu doldur'}));
topics.filter(t=>topic=='Hepsi'||t.name==topic).forEach(t=>t.gaps.forEach(g=>items.push({y:'t',p:g.q,a:g.a,lab:'Boşluğu yaz ('+t.name+')'})))}
Q=sh(items).slice(0,10);qi=0;sc=0;ans=null;go()}
function pick(i){const q=Q[qi];ans=i;okf=q.o[i]==q.a;if(okf)sc++;go()}
function chk(){const q=Q[qi],v=$('#ti').value;ans=v;okf=nz(v)==nz(q.a);if(okf)sc++;go()}
function vQuiz(){if(!Q)return sel()+`<p>10 soruluk hızlı tekrar. Neyi çalışalım?</p><div class="row"><button class="p" onclick="build('k')">Kelime</button><button class="p" onclick="build('g')">Dilbilgisi</button><button class="p" onclick="build('m')">Karışık</button></div>`;
if(!Q.length)return sel()+'<p>Bu seçimde soru çıkmadı. Başka bir tür veya konu seç.</p><button onclick="Q=null;go()">Geri dön</button>';
if(qi>=Q.length)return `<div class="fc st"><div class="big">${sc}/${Q.length}</div><small>${sc>=Q.length*.8?'Çok iyi. Daha zor bir konuya geçebilirsin.':'Bir tur daha çöz; tekrar kalıcılığı artırır.'}</small></div><button class="p" onclick="Q=null;go()">Yeni quiz</button>`;
const q=Q[qi],d=ans!=null;
let b=`<p class="mut">${qi+1}/${Q.length}. ${esc(q.lab)}</p><div class="fc st"><div class="big">${esc(q.p)}</div></div>`;
if(q.say)b+=`<button onclick="say(Q[qi].say)">Dinle</button>`;
if(q.y=='m')b+=q.o.map((o,i)=>`<button class="opt ${d?(o==q.a?'ok':i==ans?'bad':''):''}" ${d?'disabled':''} onclick="pick(${i})">${esc(o)}</button>`).join('');
else b+=`<input id="ti" ${d?'disabled value="'+esc(ans)+'"':''} placeholder="Cevabın" autocomplete="off" onkeydown="if(event.key=='Enter')chk()">`+(d?'':'<button class="p" onclick="chk()">Kontrol et</button>');
if(d)b+=`<div class="fb">${okf?'Doğru.':'Doğrusu: <b>'+esc(q.a)+'</b>'}${q.e?'<br>'+esc(q.e):''}</div><button class="p" onclick="qi++;ans=null;go()">Sonraki</button>`;
return b}

function vRead(){const p=RD[rp];return `<div class="row">${RD.map((_,i)=>`<button class="${i==rp?'p':''}" onclick="rp=${i};rs={};go()">Metin ${i+1}</button>`).join('')}</div>
<div class="fc st" style="text-align:left"><p style="margin-top:0">${esc(p.t)}</p><button onclick="say(RD[rp].t)">Sesli oku</button></div>`+
p.q.map((q,k)=>`<p><b>${esc(q.q)}</b></p>`+q.o.map((o,oi)=>{const s=rs[k];return `<button class="opt ${s!=null?(oi==q.a?'ok':oi==s?'bad':''):''}" ${s!=null?'disabled':''} onclick="rs[${k}]=${oi};go()">${esc(o)}</button>`}).join('')).join('')}

function newL(){const s=SENT[Math.floor(Math.random()*SENT.length)];LS={s,o:sh([s,...sh(SENT.filter(x=>x!==s)).slice(0,2)]),a:null}}
function mic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){P.res={err:'Bu tarayıcı konuşma tanımayı desteklemiyor. Chrome veya Safari dene.'};return go()}
const r=new R();r.lang='fr-FR';r.onresult=e=>{const h=e.results[0][0].transcript,a=nz(h),b=nz(P.s);P.res={h,p:Math.round(100*(1-lev(a,b)/Math.max(a.length,b.length,1)))};go()};
r.onerror=()=>{P.res={err:'Mikrofon izni verilmedi veya ses alınamadı.'};go()};P.res={wait:1};go();r.start()}
function vListen(){if(!LS)newL();
let b=`<h3>Dinle ve seç</h3><button class="p" onclick="say(LS.s)">Cümleyi çal</button>`+LS.o.map((o,i)=>`<button class="opt ${LS.a!=null?(o==LS.s?'ok':i==LS.a?'bad':''):''}" ${LS.a!=null?'disabled':''} onclick="LS.a=${i};go()">${esc(o)}</button>`).join('')+(LS.a!=null?'<button class="p" onclick="newL();go()">Sonraki</button>':'');
const ps=SENT.concat(allV().map(v=>v.fr)),r=P.res;
b+=`<h3>Telaffuz</h3><select aria-label="Cümle" onchange="P={s:this.value};go()">${ps.map(x=>`<option ${x==P.s?'selected':''}>${esc(x)}</option>`).join('')}</select>
<div class="fc st"><div class="big">${esc(P.s)}</div></div><div class="row"><button onclick="say(P.s)">Dinle</button><button class="p" onclick="mic()">Söyle</button></div>`;
if(r)b+=`<div class="fb">${r.wait?'Dinleniyor...':r.err?esc(r.err):'Duyulan: '+esc(r.h)+'<br>Benzerlik: %'+r.p+'. '+(r.p>=85?'Çok iyi.':r.p>=60?'Fena değil, bir daha dene.':'Önce dinle, sonra yavaşça tekrar et.')}</div><p class="mut">Bu ölçüm tarayıcının konuşma tanımasına dayanır; yaklaşık bir göstergedir.</p>`;
return b}

function addT(){const n=$('#tn').value.trim(),vocab=[],gaps=[];
$('#tv').value.split('\n').forEach(l=>{const i=l.indexOf('=');if(i>0&&l.slice(i+1).trim())vocab.push({fr:l.slice(0,i).trim(),tr:l.slice(i+1).trim()})});
$('#tg').value.split('\n').forEach(l=>{const i=l.indexOf('|');if(i>0&&l.slice(i+1).trim())gaps.push({q:l.slice(0,i).trim(),a:l.slice(i+1).trim()})});
if(!n||!(vocab.length||gaps.length)){alert('Konu adı ve en az bir kelime ya da boşluk cümlesi gerekli.');return}
const t=topics.find(x=>x.name==n);if(t){t.vocab.push(...vocab);t.gaps.push(...gaps)}else topics.push({name:n,vocab,gaps});
topic=n;draft=null;pub()}
function delT(i){topics.splice(i,1);topic='Hepsi';pub()}
function vTopics(){const d=draft||{name:'',vocab:[],gaps:[]};return `<p class="mut">Yönetici paneli: yalnızca sen görürsün. Eklediğin konuları herkes görür.</p>
<h3>Defter fotoğrafından</h3><input id="ph" type="file" accept="image/*" multiple><button class="p" onclick="fromPhoto()">Alıştırma oluştur</button>${busy?`<div class="fb">${esc(busy)}</div>`:''}
<h3>Konu</h3><label for="tn">Konu adı</label><input id="tn" value="${esc(d.name)}" placeholder="Örn. Ders 5 - Alışveriş">
<label for="tv">Kelimeler (her satır: fransızca = türkçe)</label><textarea id="tv" rows="6" placeholder="la pomme = elma">${esc(d.vocab.map(v=>v.fr+' = '+v.tr).join('\n'))}</textarea>

{t:'3. Présente-toi en détails',i:[{q:'Présente-toi en détails, en soixante à quatre-vingts mots : nom, âge, nationalité, ville, famille, école, matières préférées, caractère, goûts, loisirs, sports, langues, projets.',a:'Bonjour ! Je m’appelle Lucas Martin et j’ai 11 ans. Je suis français et j’habite à Lyon avec mes parents et ma sœur. Je suis en cinquième. Au collège, mes matières préférées sont le français et le sport. Je suis assez sportif, sociable et curieux. Pendant mon temps libre, j’aime jouer au football, écouter de la musique et sortir avec mes amis. Je parle français et un peu anglais. Plus tard, je voudrais devenir journaliste.'}]},

{t:'6. Mes habitudes le week-end',i:[{q:'Parle de tes habitudes le week-end. À quelle heure est-ce que tu te réveilles ? Comment est-ce que tu te prépares ? Qu’est-ce que tu fais habituellement ?',a:'Le week-end, je me réveille vers neuf heures parce que je ne vais pas à l’école. Je me lève tranquillement, je me lave et je m’habille. Ensuite, je prends mon petit-déjeuner avec ma famille. Le matin, je me repose un peu et je regarde des vidéos. L’après-midi, je retrouve mes amis et nous nous promenons dans le quartier. Quelquefois, je fais du sport ou je vais au cinéma. Le soir, je dîne avec ma famille, puis je me couche vers onze heures. J’aime beaucoup le week-end parce que je peux me détendre !'}]},
{t:'7. Mon samedi dernier',i:[{q:'Raconte ton samedi dernier. À quelle heure est-ce que tu t’es levé ? Qu’est-ce que tu as fait ? Avec qui ? Est-ce que tu t’es amusé ?',a:'Samedi dernier, je me suis réveillé(e) vers neuf heures et je me suis levé(e) quelques minutes plus tard. Je me suis lavé(e) et je me suis habillé(e). Ensuite, j’ai pris mon petit-déjeuner avec ma famille. L’après-midi, je suis sorti(e) avec mes amis. Nous sommes allés au cinéma et nous avons mangé une pizza. Après le cinéma, nous nous sommes promenés dans le quartier. Le soir, je suis rentré(e) chez moi et je me suis couché(e) vers onze heures. Je me suis beaucoup amusé(e) et j’ai passé une très bonne journée !'}]},

{t:'9. Les livres',i:[{q:'Aimez-vous lire ? Quand lisez-vous ? Quel est votre type de livre, de journal ou de magazine préféré ?',a:'J’aime bien lire, surtout pendant mon temps libre. Je lis souvent le soir avant de dormir ou le week-end quand j’ai du temps. Mon type de livre préféré est le roman d’aventures parce que j’aime les histoires intéressantes et pleines d’action. J’aime aussi les romans policiers parce que j’adore découvrir le coupable à la fin. Je ne lis pas souvent de journaux, mais je regarde parfois les informations sur Internet. De temps en temps, je lis aussi des magazines sur le cinéma, la musique ou les voyages. Pour moi, lire est une bonne activité pour se détendre et apprendre de nouvelles choses.'}]},

{t:'3. Présente-toi en détails',i:[{q:'Présente-toi en détails : nom, âge, nationalité, ville, école, matières préférées, famille, caractère, goûts, loisirs, langues, projets.',a:'Bonjour je m’appelle Mila Sarı et j’ai dix ans. J’habite à İstanbul en Turquie. Je suis turque. j’étudie au collège de Galatasaray. Je suis en 5A. Mes matières préférées sont le français et le turc. J’ai les yeux marron et les cheveux châtains et longs. Mon père s’appelle Ali, il a 43 ans et il est médecin. Ma mère s’appelle İzlem, elle a 38 ans et elle est vendeuse. Je suis travailleuse, sympathique et active. J’aime beaucoup écouter de la musique, regarder des films et lire des livre. Je fais de la danse et je fais de la gymnastique. Je parle turc, français et anglais. Plus tard, je voudrais être danseuse.'}]},

if(s.i.length>1)b+=`<div class="row">${OK>0?'<button onclick="OK--;OR=null;go()">Önceki</button>':''}${OK<s.i.length-1?'<button class="p" onclick="OK++;OR=null;go()">Sonraki soru</button>':''}</div>`;
return b}
/* ===== ZAMANLAR KONU ANLATIMLARI ===== */
let ZM='g',ZQ={p:null,f:null},zqi={p:0,f:0},zqs={p:0,f:0},zqa={p:null,f:null},YBv='aller',YBs=0,YBQ=null,YBa=null,YBok=false,YBsc=0,YBn=0;
const ztb=(h,r)=>`<div style="overflow-x:auto"><table style="border-collapse:collapse;width:100%;background:var(--card)"><tr>${h.map(x=>`<th style="border:1.5px solid var(--line);padding:6px 8px;text-align:left;color:var(--ac)">${esc(x)}</th>`).join('')}</tr>${r.map(a=>`<tr>${a.map(x=>`<td style="border:1.5px solid var(--line);padding:6px 8px">${esc(x)}</td>`).join('')}</tr>`).join('')}</table></div>`;
const AVF=['ai','as','a','avons','avez','ont'];
const zp=(inf)=>{const v=VB.find(x=>x.inf==inf);return SJ.map((j,i)=>sj(i,v.p[i]))};
const ZMEN=[['g','Geçmiş zaman'],['p','Geniş zaman'],['f','Gelecek zaman'],['y','Yan yana çalış']];
const ZP_Q=[
['Chaque matin, je ___ à sept heures. (se lever)',['me lève','me suis levé','vais me lever'],0],
['Tu ___ à la plage le week-end. (aller)',['vas','es allé','allez'],0],
['Nous ___ du shopping. (faire)',['faisons','faisez','fait'],0],
['Ils ___ le train tous les jours. (prendre)',['prennent','prend','prenons'],0],
['Vous ___ venir avec nous ? (pouvoir)',['pouvez','pouvons','peuvent'],0],
['Elle ___ heureuse. (être)',['est','a','es'],0],
['Je ___ français. (parler)',['parle','parles','parlons'],0],
['Nous ___ à la cantine. (manger)',['mangeons','mangons','mangez'],0],
['Le soir, tu te ___. (se doucher)',['douches','douche','douchez'],0],
['Elles ___ du sport le samedi. (faire)',['font','faisent','fait'],0]];
const ZF_Q=[
['Demain, je ___ à l’école.',['vais aller','vais allé','vais va'],0],
['Nous ___ visiter Paris.',['allons','allez','vont'],0],
['Tu ___ venir avec nous ?',['vas','va','vais'],0],
['Ils ___ partir demain.',['vont','allons','va'],0],
['Ce soir, je vais ___ tôt. (se coucher)',['me coucher','me couché','se coucher'],0],
['Elle ne ___ pas manger.',['va','vas','vais'],0],
['Vous ___ prendre le train.',['allez','allons','vont'],0],
['Demain, nous ___ faire du shopping.',['allons','allez','vont'],0],
['Dimanche prochain, je vais ___ ma grand-mère. (voir)',['voir','vu','vois'],0],
['Demain, elle va se ___ à sept heures. (réveiller)',['réveiller','réveille','réveillée'],0]];
function zmq(k){const a=k=='p'?ZP_Q:ZF_Q;ZQ[k]=sh(a).map(q=>{const o=sh(q[1]);return{p:q[0],o,a:q[1][q[2]]}});zqi[k]=0;zqs[k]=0;zqa[k]=null;go()}
function zmp(k,i){const q=ZQ[k][zqi[k]];zqa[k]=i;if(q.o[i]==q.a)zqs[k]++;go()}
function zmquiz(k){const L=ZQ[k];if(!L)return `<h3>10 soru</h3><button class="p" onclick="zmq('${k}')">Alıştırmaya başla</button>`;
const i=zqi[k];if(i>=L.length)return `<div class="fc st"><div class="big">${zqs[k]}/${L.length}</div></div><button class="p" onclick="zmq('${k}')">Tekrar çöz</button>`;
const q=L[i],a=zqa[k],d=a!=null;
return `<h3>Alıştırma</h3><p class="mut">${i+1}/${L.length}</p><div class="fc st"><div class="big" style="font-size:1.25rem">${esc(q.p)}</div></div>`+q.o.map((o,x)=>`<button class="opt ${d?(o==q.a?'ok':x==a?'bad':''):''}" ${d?'disabled':''} onclick="zmp('${k}',${x})">${esc(o)}</button>`).join('')+(d?`<div class="fb">${q.o[a]==q.a?'Doğru.':'Yanlış. Doğrusu: <b>'+esc(q.a)+'</b>'}</div><button class="p" onclick="zqi['${k}']++;zqa['${k}']=null;go()">Sonraki</button>`:'')}
function vZPast(){const E=EA.filter(x=>x.a=='e');
return vKonu().replace(/<button class="p" onclick="PC=false;go\(\)">Alıştırmaya geç<\/button>/,'')+
`<h3>Être ile kurulan ${E.length} fiil ve Türkçeleri</h3><p class="mut">Mila için dişil biçimle yazıldı. Dinle düğmesine bas, sonra tekrar et.</p>`+
E.map(x=>{const f=x.ex.replace('(e)','e');return `<div class="tp"><span><b>${esc(x.v)}</b> · ${esc(x.tr)}<br><small class="mut">${esc(f)}</small></span><button onclick="say('${f.replace(/'/g,"\\'").replace(/’/g,"\\’")}')">Dinle</button></div>`}).join('')+
`<h3>Alıştırma</h3><p class="mut">Passé composé alıştırmaları için “Passé composé” sekmesini kullan.</p>`}
function vZPres(){
const hd=['','parler','être','avoir','aller','faire'],rows=SJ.map((j,i)=>[j,zp('être')[i]&&sj(i,['parle','parles','parle','parlons','parlez','parlent'][i]),zp('être')[i],sj(i,AVF[i]),zp('aller')[i],zp('faire')[i]]);
const rows2=SJ.map((j,i)=>[j,zp('prendre')[i],zp('venir')[i],zp('pouvoir')[i],zp('vouloir')[i],zp('se réveiller')[i]]);
return `<h3>Geniş zaman (présent) ne zaman kullanılır?</h3><p>Alışkanlıklar, şu an olanlar ve genel bilgiler için: <b>Chaque matin, je me lève à sept heures.</b> (Her sabah yediyi kalkarım.)</p>
<h3>-er fiilleri</h3><div class="fb"><b>Kök + e, es, e, ons, ez, ent</b><br>parler → je parle, tu parles, il parle, nous parlons, vous parlez, ils parlent<br>manger → nous <b>mangeons</b> (g korunur)</div>
<h3>Sık kullanılan düzensiz fiiller</h3>${ztb(hd,rows)}<br>${ztb(['','prendre','venir','pouvoir','vouloir','se réveiller'],rows2)}
<h3>Dönüşlü fiiller</h3><p>me, te, se, nous, vous, se + fiil: <b>je me réveille, tu te lèves, nous nous dépêchons</b></p>
<h3>Olumsuz</h3><p>ne + fiil + pas: <b>Je ne mange pas de viande.</b> · <b>Je ne me réveille pas tôt.</b></p>
<h3>Zaman ifadeleri</h3><p>chaque jour · tous les soirs · le matin · le week-end · souvent · toujours · parfois · rarement · jamais</p>
<h3>Dikkat: sık hata</h3><p>✗ nous faisez → ✓ <b>nous faisons</b><br>✗ vous faisons → ✓ <b>vous faites</b></p>`+zmquiz('p')}
function vZFut(){
const rows=SJ.map((j,i)=>[sj(i,VA[i]),sj(i,VA[i])+' manger',SJ[i]+' '+rf(i,'lever').replace(/^/,'')]);
return `<h3>Gelecek zaman (futur proche) ne zaman kullanılır?</h3><p>Yakın gelecekte yapılacak planlar için: <b>Demain, je vais visiter Paris.</b> (Yarın Paris’i ziyaret edeceğim.)</p>
<h3>Yapısı</h3><div class="fb"><b>aller (geniş zaman) + fiilin mastarı (-er, -ir, -re)</b><br>je vais manger · tu vas partir · il va prendre</div>
${ztb(['özne','aller','örnek'],SJ.map((j,i)=>[j,VA[i],sj(i,VA[i])+' manger']))}
<h3>Dönüşlü fiiller</h3><p>Zamir özneye uyar, fiil mastar kalır: <b>je vais me lever · tu vas te coucher · nous allons nous dépêcher</b></p>
<h3>Olumsuz</h3><p>ne + aller + pas + mastar: <b>Je ne vais pas manger.</b> · <b>Nous n’allons pas nous dépêcher.</b></p>
<h3>Zaman ifadeleri</h3><p>demain · ce soir · ce week-end · la semaine prochaine · dimanche prochain · l’été prochain · bientôt</p>
<h3>Dikkat: sık hata</h3><p>✗ je vais allé → ✓ <b>je vais aller</b><br>✗ je vais mange → ✓ <b>je vais manger</b> (mastar)</p>
<h3>Ek bilgi: futur simple (şimdilik zorunlu değil)</h3><div class="fb">Mastar + ai, as, a, ons, ez, ont: je mangerai, tu partiras, il prendra, nous irons (aller düzensiz), je serai, j’aurai, je ferai.<br>A2 sınavında futur proche yeterlidir.</div>`+zmquiz('f')}
function ysay(t){say(fm(VB.find(x=>x.inf==YBv),t,YBs,0).replace(/\(e\)/g,''))}
function ybc(){const v=VB.find(x=>x.inf==YBv),i=YBs;
return `<p class="mut">Aynı cümleyi üç zamanda yan yana gör. Önce tabloya bak, sonra kapatıp sesli söylemeyi dene.</p>
<label for="yv">Fiil</label><select id="yv" onchange="YBv=this.value;go()">${VB.map(x=>`<option value="${esc(x.inf)}" ${x.inf==YBv?'selected':''}>${esc(x.inf)} · ${esc(x.tr)}</option>`).join('')}</select>
<label for="ys">Özne</label><select id="ys" onchange="YBs=+this.value;go()">${SJ.map((j,k)=>`<option value="${k}" ${k==i?'selected':''}>${j}</option>`).join('')}</select>
${ztb(['Her gün (présent)','Dün (passé composé)','Yarın (futur proche)'],[['p','c','f'].map(t=>fm(v,t,i,0))])}
<div class="row"><button onclick="ysay('p')">Dinle: geniş</button><button onclick="ysay('c')">Dinle: geçmiş</button><button onclick="ysay('f')">Dinle: gelecek</button></div>
<h3>Hazır cümleler</h3>`+ztb(['Her gün','Dün','Yarın'],[
['Je mange une pomme.','J’ai mangé une pomme.','Je vais manger une pomme.'],
['Je vais à l’école.','Je suis allée à l’école.','Je vais aller à l’école.'],
['Je joue au football.','J’ai joué au football.','Je vais jouer au football.'],
['Nous prenons le train.','Nous avons pris le train.','Nous allons prendre le train.'],
['Tu regardes un film.','Tu as regardé un film.','Tu vas regarder un film.'],
['Elle se couche à dix heures.','Elle s’est couchée à dix heures.','Elle va se coucher à dix heures.'],
['Nous visitons le musée.','Nous avons visité le musée.','Nous allons visiter le musée.'],
['Ils font du sport.','Ils ont fait du sport.','Ils vont faire du sport.']])+
`<h3>Kendini dene</h3>`+ybq()}
function ybnew(){const v=VB[rn(VB.length)],i=rn(6),t='pcf'[rn(3)];YBQ={v,i,t,q:yq(v.inf,t,i)};YBa=null;go()}
function ybchk(){const u=$('#yb').value;YBa=u;YBok=tcheck(YBQ.q,u);YBn++;if(YBok)YBsc++;go()}

return `<p class="mut">Skor: ${YBsc}/${YBn}</p><div class="fc st"><div class="big" style="font-size:1.25rem">${c} · ${SJ[YBQ.i]} · ${esc(YBQ.v.inf)} (${esc(YBQ.v.tr)})</div></div><p class="mut">Özneyle birlikte yaz. Örnek: je suis allé(e)</p><input id="yb" ${d?'disabled value="'+esc(YBa)+'"':''} autocomplete="off" autocapitalize="none" onkeydown="if(event.key=='Enter'&&!YBa)ybchk()">`+(d?`<div class="fb">${YBok?'Doğru.':'Yanlış.'} Doğrusu: <b>${esc(YBQ.q.a)}</b></div><button class="p" onclick="ybnew()">Sonraki</button>`:`<button class="p" onclick="ybchk()">Kontrol et</button>`)}
function vZam(){return `<div class="row">${ZMEN.map(x=>`<button class="${ZM==x[0]?'p':''}" onclick="ZM='${x[0]}';go()">${x[1]}</button>`).join('')}</div>`+(ZM=='g'?vZPast():ZM=='p'?vZPres():ZM=='f'?vZFut():ybc())}
